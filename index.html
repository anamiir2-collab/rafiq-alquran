<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="رفيق القرآن - مساعدك الذكي لحفظ القرآن الكريم ومراجعته بطريقة منظمة وتفاعلية">
<meta name="theme-color" content="#1a6b54">
<meta name="author" content="Amir Anwar">

<link rel="icon" type="image/png" href="assets/ui-image-1.png">
<link rel="apple-touch-icon" href="assets/logo-1.png">
<link rel="manifest" href="manifest.json">

<title>رفيق القرآن - مساعدك الذكي لحفظ القرآن</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- شاشة التحميل -->
<div id="app-loader" aria-label="جاري تحضير التطبيق">
  <div class="loader-inner">

    <div class="loader-logo-wrap">
      <img
        class="loader-logo"
        src="assets/logo-1.png"
        alt="رفيق القرآن"
      >
      <div class="loader-shine"></div>
    </div>

    <div class="loader-status">
      جاري تحضير التطبيق
    </div>

    <div class="loader-progress" aria-hidden="true">
      <span></span>
    </div>

    <div class="loader-credit">
      Created by Amir Anwar
    </div>

  </div>
</div>

<!-- التطبيق -->
<div id="app"></div>

<!-- التنبيهات -->
<div id="toast-container" class="toast-container"></div>

<!-- بيانات التطبيق -->
<script src="js/app-data.js"></script>

<!-- واجهة التطبيق -->
<script src="js/app-ui.js"></script>

<!-- تشغيل التطبيق -->
<script>
(function () {

  function hideLoader() {
    const loader = document.getElementById('app-loader');
    const app = document.getElementById('app');

    if (app) app.classList.add('app-ready');

    if (loader) {
      loader.classList.add('is-hidden');

      setTimeout(function () {
        if (loader && loader.parentNode) {
          loader.remove();
        }
      }, 950);
    }
  }

  function showError(error) {
    console.error('رفيق القرآن - ERROR:', error);

    const app = document.getElementById('app');

    const message =
      error && error.message
        ? error.message
        : String(error);

    if (app) {
      app.classList.add('app-ready');

      app.innerHTML = `
        <div style="
          min-height:100vh;
          box-sizing:border-box;
          padding:40px 20px;
          display:flex;
          align-items:center;
          justify-content:center;
          font-family:Cairo,sans-serif;
          direction:rtl;
          background:#fbf5e8;
        ">
          <div style="
            width:100%;
            max-width:600px;
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 10px 40px rgba(0,0,0,.08);
            text-align:center;
          ">
            <div style="font-size:50px;margin-bottom:15px">⚠️</div>

            <h2 style="margin:0 0 15px">
              حدث خطأ أثناء تشغيل التطبيق
            </h2>

            <p style="color:#777">
              تفاصيل الخطأ:
            </p>

            <div style="
              direction:ltr;
              text-align:left;
              background:#f5f5f5;
              padding:15px;
              border-radius:12px;
              overflow:auto;
              color:#b42318;
              font-family:monospace;
              font-size:13px;
              white-space:pre-wrap;
            ">${message.replace(/</g, '&lt;')}</div>

            <button
              onclick="location.reload()"
              style="
                margin-top:20px;
                border:0;
                padding:12px 25px;
                border-radius:12px;
                background:#1a6b54;
                color:white;
                font-family:Cairo,sans-serif;
                cursor:pointer;
              "
            >
              إعادة تحميل التطبيق
            </button>
          </div>
        </div>
      `;
    }

    hideLoader();
  }

  try {

    if (typeof loadState !== 'function') {
      throw new Error('الدالة loadState غير موجودة');
    }

    loadState();

    if (typeof render !== 'function') {
      throw new Error('الدالة render غير موجودة');
    }

    render();

    hideLoader();

  } catch (error) {
    showError(error);
  }

})();
</script>
</body>
</html>
